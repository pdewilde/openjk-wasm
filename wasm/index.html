<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenJK WebAssembly</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            background: #000;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .banner {
            margin-bottom: 40px;
        }
        .banner h1 {
            font-size: 3rem;
            margin: 0;
            color: #007bff;
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }
        .banner p {
            font-size: 1.2rem;
            color: #aaa;
        }
        .main-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
        .owner-buttons {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-small {
            background: #333;
            color: #888;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .btn-small:hover {
            background: #555;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>OpenJK WebAssembly</h1>
        <p>Star Wars: Jedi Knight: Jedi Academy in your browser</p>
    </div>

    <div class="main-buttons">
        <a href="openjk_upload.html" class="btn">Single Player</a>
        <a href="openjk_mp_upload.html" class="btn">Multiplayer</a>
    </div>

    <div class="owner-buttons">
        <a href="openjk_bundled.html" class="btn-small">owner-sp</a>
        <a href="openjk_mp_bundled.html" class="btn-small">owner-mp</a>
    </div>
</body>
</html>
