<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>OpenJK — Jedi Academy (Upload Assets)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #status {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #setup-ui {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            z-index: 1000;
        }

        #setup-ui h2 {
            margin-bottom: 15px;
        }

        #setup-ui p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }

        #file-input {
            display: none;
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #0056b3;
        }

        canvas.emscripten {
            border: 0;
            cursor: none;
            outline: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #output {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            padding: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="status">Waiting for assets...</div>
    
    <div id="setup-ui">
        <h2>Assets Required</h2>
        <p>Please select your Jedi Academy <b>base</b> folder to start the game. Your files stay on your computer.</p>
        <input type="file" id="file-input" webkitdirectory directory multiple>
        <button class="btn" onclick="document.getElementById('file-input').click()">Select "base" Folder</button>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="output"></div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var outputElement = document.getElementById('output');
        var setupUI = document.getElementById('setup-ui');
        var fileInput = document.getElementById('file-input');

        var mountedFiles = [];

        var Module = {
            noInitialRun: true,
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                if (outputElement) {
                    outputElement.innerHTML += text + '<br>';
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: canvasElement,
            setStatus: function (text) {
                if (text) statusElement.innerHTML = text;
                else statusElement.style.display = 'none';
            },
            preRun: [function () {
                console.log("Pre-run: Initializing filesystem...");
                var fs = Module.FS || FS;
                try { fs.mkdir('/saves'); } catch (e) { }
                try { fs.mkdir('/base'); } catch (e) { }
            }]
        };

        var runtimeInitialized = false;
        Module.onRuntimeInitialized = function() {
            console.log("Emscripten runtime initialized.");
            runtimeInitialized = true;
        };

        fileInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            if (!runtimeInitialized) {
                alert("Engine is still initializing, please wait a few seconds and try again.");
                return;
            }

            setupUI.style.display = 'none';
            canvasElement.style.display = 'block';
            Module.setStatus('Loading assets...');

            const fs = Module.FS || FS;

            for (const file of files) {
                const pathParts = file.webkitRelativePath.split('/');
                const baseIndex = pathParts.lastIndexOf('base');
                if (baseIndex === -1) continue;

                const relativePath = pathParts.slice(baseIndex).join('/');
                const virtualPath = '/' + relativePath;
                
                // Create directories
                const parts = relativePath.split('/');
                let curr = '';
                for (let i = 0; i < parts.length - 1; i++) {
                    curr += '/' + parts[i];
                    try { fs.mkdir(curr); } catch (e) { }
                }

                try {
                    const buffer = await file.arrayBuffer();
                    fs.writeFile(virtualPath, new Uint8Array(buffer));
                    console.log("Mounted:", virtualPath, "(" + file.size + " bytes)");
                } catch (err) {
                    console.error("Error mounting file " + virtualPath + ":", err);
                }
            }

            Module.setStatus('Starting game...');
            setTimeout(() => {
                const callMainFunc = Module['callMain'] || Module.callMain;
                if (typeof callMainFunc === 'function') {
                    console.log("Calling callMain()...");
                    callMainFunc(Module.arguments || []);
                } else {
                    console.error("Module.callMain not found! Falling back to run()...");
                    const runFunc = Module['run'] || Module.run || (typeof run !== 'undefined' ? run : null);
                    if (typeof runFunc === 'function') {
                        runFunc();
                    } else {
                        Module.setStatus("Error: Could not start the engine.");
                    }
                }
            }, 100);
        });

        // Toggle console with backtick
        document.addEventListener('keydown', function (e) {
            if (e.key === '`') {
                outputElement.style.display = outputElement.style.display === 'none' ? 'block' : 'none';
            }
        });

        window.onerror = function () {
            Module.setStatus('Exception thrown, see JavaScript console');
        };
    </script>
    {{{ SCRIPT }}}
</body>

</html>
